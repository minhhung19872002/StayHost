# Production stack for the VPS.
#
# Unlike docker-compose.yml (which builds locally for development), this file never
# builds: CI builds the image on GitHub and pushes it to GHCR, and the deploy job on
# the VPS only pulls and restarts. Secrets come from an env file kept off the repo —
# see DEPLOY.md.
#
#   docker compose -p stayhost -f docker-compose.prod.yml --env-file ~/deploy/stayhost.env up -d

services:
  db:
    image: postgres:17-alpine
    container_name: stayhost-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stayhost}
      POSTGRES_USER: ${POSTGRES_USER:-stayhost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      TZ: Asia/Ho_Chi_Minh
    # No published port: only the web container needs the database.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stayhost} -d ${POSTGRES_DB:-stayhost}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # docs/01 TĐ-03, TN-06 — self-hosted translation, free and unlimited (no API key,
  # no per-character cost). First start downloads models (a few minutes), kept in a
  # volume. LT_LOAD_ONLY limits models to the languages the app offers.
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: stayhost-translate
    environment:
      LT_LOAD_ONLY: ${TRANSLATE_LANGS:-en,vi,zh,ko,ja,fr,de,es}
      # Models install on the volume's first run only, so without this a later
      # change to TRANSLATE_LANGS is silently ignored — the engine stays healthy
      # and answers "de is not supported".
      LT_UPDATE_MODELS: "true"
      LT_DISABLE_WEB_UI: "true"
    volumes:
      - lt-models:/home/libretranslate/.local
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/languages')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s
    restart: unless-stopped

  web:
    image: ${STAYHOST_IMAGE:?STAYHOST_IMAGE must be set}
    container_name: stayhost-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=${POSTGRES_DB:-stayhost};Username=${POSTGRES_USER:-stayhost};Password=${POSTGRES_PASSWORD}"
      TZ: Asia/Ho_Chi_Minh
      # Outgoing mail. Without these the queue fills and nothing ever leaves —
      # which also means the six-digit code an admin needs to sign in (docs/08
      # §3) never arrives, and the console is unreachable.
      Email__Host: ${EMAIL_HOST:-}
      Email__Port: ${EMAIL_PORT:-587}
      Email__User: ${EMAIL_USER:-}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__FromAddress: ${EMAIL_FROM:-no-reply@staylio.vn}
      Email__FromName: ${EMAIL_FROM_NAME:-Staylio}
      Email__UseImplicitTls: ${EMAIL_IMPLICIT_TLS:-false}
      # What a link inside those emails is prefixed with — the reader is outside
      # the browser tab, so a relative path is not clickable. Left unset it falls
      # back to PSP_PUBLIC_URL below, which is the same address; set it only if
      # this app is somehow reached on two different names.
      Site__PublicUrl: ${SITE_PUBLIC_URL:-}
      # Which inbox the console account signs in with, and where its six-digit
      # code goes. Empty leaves the seeded admin@staylio.vn alone.
      Admin__Email: ${ADMIN_EMAIL:-}
      # docs/08 §3 says no exceptions. false is the exception, for a server that
      # cannot post the code anywhere yet — see DEPLOY.md §2.1.
      Admin__RequireTwoFactor: ${ADMIN_REQUIRE_2FA:-true}
      # docs/01 TK-02 — signing in with Google, Apple or Facebook. appsettings.json
      # is baked into the image, so without these lines the only way to configure a
      # provider in production would be to rebuild. A provider left empty keeps its
      # button off the sign-in modal, so unset is a working state rather than a
      # broken one. The client ids are public — they reach the browser regardless —
      # but the Facebook app secret is not, which is why it comes from the env file.
      ExternalLogin__GoogleClientId: ${GOOGLE_CLIENT_ID:-}
      ExternalLogin__AppleServicesId: ${APPLE_SERVICES_ID:-}
      ExternalLogin__AppleRedirectUri: ${APPLE_REDIRECT_URI:-}
      ExternalLogin__FacebookAppId: ${FACEBOOK_APP_ID:-}
      ExternalLogin__FacebookAppSecret: ${FACEBOOK_APP_SECRET:-}
      # docs/01 TĐ-03, TN-06 — machine translation via the self-hosted engine above.
      # Defaults on because the container ships with this stack; set
      # TRANSLATION_PROVIDER= (empty) in the env file to switch the "Dịch" button off.
      Translation__Provider: ${TRANSLATION_PROVIDER-libretranslate}
      Translation__Url: ${TRANSLATION_URL:-http://libretranslate:5000}
      Translation__ApiKey: ${TRANSLATION_API_KEY:-}
      # docs/07 §2.3 — the account a VietQR credits. Leave BANK_ACCOUNT_NUMBER
      # empty and the method never reaches the payment page, the same rule the
      # social-login buttons follow: better a missing option than one that leads
      # nowhere. None of these four is a secret — all are printed on any invoice
      # — but they decide where real guests' money lands, so they live in the env
      # file on the server rather than in this file.
      #
      # docs/07 §1 wants that account to belong to the platform, not to a person:
      # the ledger records these transfers as money held on a guest's behalf, and
      # that is only true if the account is the company's. §13's legal option is
      # still unchosen, and this switch does not choose it.
      BankTransfer__BankBin: ${BANK_BIN:-}
      BankTransfer__BankName: ${BANK_NAME:-}
      BankTransfer__AccountNumber: ${BANK_ACCOUNT_NUMBER:-}
      BankTransfer__AccountName: ${BANK_ACCOUNT_NAME:-}
      # docs/07 §14.3 — the key that seals hosts' bank account numbers at rest.
      # Empty and the number is not stored, which means the platform collects a
      # guest's payment and has nothing to forward the host's share to: §13's
      # option A splits by bulk bank transfer and that file needs real numbers.
      # 32 bytes, base64. Changing it makes every stored account unreadable, so
      # it belongs with the database backups. See DEPLOY.md §2.6.
      Payouts__AccountKey: ${PAYOUTS_ACCOUNT_KEY:-}
      # docs/07 §13 phương án A — the licensed gateways. Each stays dormant until
      # its keys arrive, and a dormant one means that payment method keeps running
      # against the built-in stand-in rather than breaking. PSP_PUBLIC_URL has to
      # be an address the gateway can reach: it is where the guest is sent back to
      # and where the IPN is posted.
      #
      # Endpoints default to the sandboxes so a half-configured server cannot move
      # real money by accident. Switching to production means setting all three.
      Psp__PublicUrl: ${PSP_PUBLIC_URL:-}
      Psp__Vnpay__TmnCode: ${VNPAY_TMN_CODE:-}
      Psp__Vnpay__HashSecret: ${VNPAY_HASH_SECRET:-}
      Psp__Vnpay__PayUrl: ${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      Psp__Vnpay__ApiUrl: ${VNPAY_API_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      # docs/07 §4, §15.5 — keeping a card at VNPay. Off unless they have enabled
      # the token feature for this merchant: a "lưu thẻ này" tick their gateway
      # then refuses is worse than no tick at all. It is also the only way this
      # platform ever learns a card's last four digits.
      Psp__Vnpay__Tokens: ${VNPAY_TOKENS:-false}
      Psp__Vnpay__CreateTokenUrl: ${VNPAY_CREATE_TOKEN_URL:-https://sandbox.vnpayment.vn/token_ui/pay-create-token.html}
      Psp__Vnpay__TokenPayUrl: ${VNPAY_TOKEN_PAY_URL:-https://sandbox.vnpayment.vn/token_ui/payment-token.html}
      # docs/07 §13, §15.3 — OnePay, a second gateway for the same card row.
      # It exists because VNPay's sandbox publishes only a domestic NCB test
      # card, so the international branch could never be proven end to end;
      # OnePay's public test merchant authorises a Visa card properly. Empty and
      # nothing changes — the card row stays with whatever Psp__Methods says.
      Psp__Onepay__Merchant: ${ONEPAY_MERCHANT:-}
      Psp__Onepay__AccessCode: ${ONEPAY_ACCESS_CODE:-}
      Psp__Onepay__HashSecret: ${ONEPAY_HASH_SECRET:-}
      Psp__Onepay__PayUrl: ${ONEPAY_PAY_URL:-https://mtf.onepay.vn/vpcpay/vpcpay.op}
      # The domestic gateway. Same merchant and secret; only the address decides
      # whether the guest meets a Visa form or the list of Vietnamese banks.
      Psp__Onepay__DomesticPayUrl: ${ONEPAY_DOMESTIC_PAY_URL:-https://mtf.onepay.vn/onecomm-pay/vpc.op}
      Psp__Onepay__ApiUrl: ${ONEPAY_API_URL:-https://mtf.onepay.vn/vpcpay/Vpcdps.op}
      Psp__Onepay__DomesticApiUrl: ${ONEPAY_DOMESTIC_API_URL:-https://mtf.onepay.vn/onecomm-pay/Vpcdps.op}
      # Issued separately from the hash secret. Without them the gateway still
      # takes money; only §5's self-check and §10's refunds go quiet, loudly.
      Psp__Onepay__ApiUser: ${ONEPAY_API_USER:-}
      Psp__Onepay__ApiPassword: ${ONEPAY_API_PASSWORD:-}
      # Which gateway serves the card row. Empty keeps VNPay.
      Psp__Methods__card: ${PSP_METHODS_CARD:-vnpay}
      Psp__Methods__napas: ${PSP_METHODS_NAPAS:-vnpay}
      Psp__Momo__PartnerCode: ${MOMO_PARTNER_CODE:-}
      Psp__Momo__AccessKey: ${MOMO_ACCESS_KEY:-}
      Psp__Momo__SecretKey: ${MOMO_SECRET_KEY:-}
      Psp__Momo__Endpoint: ${MOMO_ENDPOINT:-https://test-payment.momo.vn/v2/gateway/api}
      Psp__Zalopay__AppId: ${ZALOPAY_APP_ID:-}
      Psp__Zalopay__Key1: ${ZALOPAY_KEY1:-}
      Psp__Zalopay__Key2: ${ZALOPAY_KEY2:-}
      Psp__Zalopay__Endpoint: ${ZALOPAY_ENDPOINT:-https://sb-openapi.zalopay.vn/v2}
    # Nginx terminates TLS on the host and proxies here, so the port stays on loopback.
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      # Listing photos are written to wwwroot/uploads; they must outlive the image.
      - uploads:/app/wwwroot/uploads
      # docs/08 §4 — identity documents deliberately live OUTSIDE wwwroot so the
      # static file middleware cannot serve them to anyone holding the URL. That
      # puts them inside the image unless they get a volume of their own, and a
      # deploy would take somebody's verification papers with it.
      - identity:/app/protected/identity
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  identity:
  lt-models:
