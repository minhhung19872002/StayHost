# Nginx site for StayHost. Install with:
#   sudo cp deploy/nginx/stayhost.conf /etc/nginx/sites-available/stayhost
#   sudo sed -i "s/__DOMAIN__/your.domain/g" /etc/nginx/sites-available/stayhost
#   sudo ln -sf /etc/nginx/sites-available/stayhost /etc/nginx/sites-enabled/stayhost
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then let Certbot add the TLS server block and the port-80 redirect:
#   sudo certbot --nginx -d __DOMAIN__

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # UploadsController accepts up to 12 photos of 8MB each.
    client_max_body_size 100m;

    # The app already gzips its own responses (UseResponseCompression).
    gzip off;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # First boot runs EF migrations and the seeder before serving.
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # Uploaded photos and hashed Vite bundles are immutable; let clients keep them.
    location /uploads/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }
}
