services:
  db:
    image: postgres:17-alpine
    container_name: stayhost-db
    environment:
      POSTGRES_DB: stayhost
      POSTGRES_USER: stayhost
      POSTGRES_PASSWORD: stayhost
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5544:5432"
    volumes:
      - stayhost-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayhost -d stayhost"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # docs/01 TĐ-03, TN-06 — self-hosted translation. Free and unlimited: no API key,
  # no per-character cost. First start downloads the language models (a few minutes),
  # kept in a volume so later starts are fast. LT_LOAD_ONLY limits models to the
  # languages the app offers, which keeps memory and startup down — it must stay in
  # step with Translations.Targets, or a reader picks a language the engine cannot
  # produce and silently gets the original back.
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: stayhost-translate
    environment:
      LT_LOAD_ONLY: "en,vi,zh,ko,ja,fr,de,es"
      # Without this the models are installed on the volume's first run only, so
      # adding a language to LT_LOAD_ONLY later changes nothing and the engine
      # answers "de is not supported" while everything else looks healthy.
      LT_UPDATE_MODELS: "true"
      LT_DISABLE_WEB_UI: "true"
    # Published on loopback so `dotnet run` on the host can reach it too: Windows
    # cannot route to a container IP, so without this the engine is reachable only
    # from inside the compose network and local development has to run a second
    # copy by hand. Run the app with Translation__Url=http://localhost:5555.
    ports:
      - "127.0.0.1:5555:5000"
    volumes:
      - lt-models:/home/libretranslate/.local
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/languages')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: src/StayHost.Web/Dockerfile
    container_name: stayhost-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=stayhost;Username=stayhost;Password=stayhost"
      # docs/01 TĐ-03 — point the app at the self-hosted engine above.
      Translation__Provider: "libretranslate"
      Translation__Url: "http://libretranslate:5000"
      # docs/07 §2.3 — VietQR stays off until an account is named. Set these in a
      # .env beside this file to try it locally; a QR built here credits a real
      # account, so there is no sensible default to ship.
      BankTransfer__BankBin: ${BANK_BIN:-}
      BankTransfer__BankName: ${BANK_NAME:-}
      BankTransfer__AccountNumber: ${BANK_ACCOUNT_NUMBER:-}
      BankTransfer__AccountName: ${BANK_ACCOUNT_NAME:-}
    volumes:
      # Same split as production: photos under wwwroot, identity documents out of
      # reach of the static file middleware (docs/08 §4).
      - uploads:/app/wwwroot/uploads
      - identity:/app/protected/identity
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  stayhost-pgdata:
  uploads:
  identity:
  lt-models:
