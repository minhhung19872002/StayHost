services:
  db:
    image: postgres:17-alpine
    container_name: stayhost-db
    environment:
      POSTGRES_DB: stayhost
      POSTGRES_USER: stayhost
      POSTGRES_PASSWORD: stayhost
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5544:5432"
    volumes:
      - stayhost-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayhost -d stayhost"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # docs/01 TĐ-03, TN-06 — self-hosted translation. Free and unlimited: no API key,
  # no per-character cost. First start downloads the language models (a few minutes),
  # kept in a volume so later starts are fast. LT_LOAD_ONLY limits models to the
  # languages the app offers, which keeps memory and startup down.
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: stayhost-translate
    environment:
      LT_LOAD_ONLY: "en,vi,zh,ko,ja,fr"
      LT_DISABLE_WEB_UI: "true"
    volumes:
      - lt-models:/home/libretranslate/.local
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/languages')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: src/StayHost.Web/Dockerfile
    container_name: stayhost-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=stayhost;Username=stayhost;Password=stayhost"
      # docs/01 TĐ-03 — point the app at the self-hosted engine above.
      Translation__Provider: "libretranslate"
      Translation__Url: "http://libretranslate:5000"
    volumes:
      # Same split as production: photos under wwwroot, identity documents out of
      # reach of the static file middleware (docs/08 §4).
      - uploads:/app/wwwroot/uploads
      - identity:/app/protected/identity
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  stayhost-pgdata:
  uploads:
  identity:
  lt-models:
